name: Application Android (APK)

# Compile l'application FlashDépôt à chaque modification du dossier android/.
# L'APK est téléchargeable dans l'onglet Actions (Artifacts : flashdepot-apk).
# Sur main, si les secrets FTP sont renseignés, il est aussi envoyé sur le site : <site>/downloads/flashdepot.apk

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Clé de signature
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "Signature : clé fixe de l'application"
          else
            echo "::warning::Secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD absents : APK signé avec une clé temporaire (il faudra désinstaller avant chaque mise à jour)."
          fi
      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk flashdepot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: flashdepot-apk
          path: android/flashdepot.apk
      - name: Préparer l'APK pour le site
        if: github.ref == 'refs/heads/main' && env.FTP_SERVER != ''
        run: |
          mkdir -p ../apk-out
          cp flashdepot.apk ../apk-out/flashdepot.apk
      - name: Publier l'APK sur le site
        if: github.ref == 'refs/heads/main' && env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./apk-out/
          server-dir: ${{ secrets.FTP_DIR }}downloads/
          state-name: .ftp-deploy-apk-state.json
